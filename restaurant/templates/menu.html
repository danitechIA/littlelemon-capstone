{% extends 'base.html' %}
{% block title %}Little Lemon - Menu{% endblock %}
{% block content %}
<h1>Our Menu</h1>
<div class="menu-grid">
    {% for item in menu_items %}
    <div class="card">
        <h3>{{ item.name }}</h3>
        <p>{{ item.menu_item_description }}</p>
        <strong>${{ item.price }}</strong>
    </div>
    {% empty %}
    <p>The menu will be available shortly.</p>
    {% endfor %}
</div>
{% endblock %}
