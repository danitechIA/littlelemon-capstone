{% extends 'base.html' %}
{% load static %}
{% block title %}Little Lemon - Reservations{% endblock %}
{% block content %}
<h1>Reservations</h1>

<div class="reservations-toolbar">
    <label for="filter_date">Filter by date:</label>
    <input type="date" id="filter_date" value="{{ today }}">
</div>

<table class="reservations-table">
    <thead>
        <tr><th>First name</th><th>Date</th><th>Time</th></tr>
    </thead>
    <tbody id="reservations-body"></tbody>
</table>
<p id="no-bookings-message" style="display:none;">No Booking</p>
{% endblock %}

{% block scripts %}
<script src="{% static 'restaurant/js/main.js' %}"></script>
<script>document.addEventListener('DOMContentLoaded', initReservationsPage);</script>
{% endblock %}
