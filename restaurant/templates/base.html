{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Little Lemon{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'restaurant/css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'index' %}" class="logo">Little Lemon</a>
            <nav>
                <a href="{% url 'index' %}">Home</a>
                <a href="{% url 'about' %}">About</a>
                <a href="{% url 'menu' %}">Menu</a>
                <a href="{% url 'book' %}">Reserve a Table</a>
                <a href="{% url 'reservations' %}">Reservations</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; Little Lemon Chicago</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
